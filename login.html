<!DOCTYPE html>
<html lang="en">
<head>
<script>
  if (localStorage.getItem('autostad-theme') === 'dark') document.documentElement.classList.add('dark');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In | AutoSTAD</title>
<meta name="description" content="Sign in to your AutoSTAD account to browse and manage your exclusive supercar collection." />
<link rel="stylesheet" href="src/output.css" />
<style>
  .hero-bg-light {
    background-image: url('images/members/sign-in-light-hd.png');
    background-size: cover;
    background-position: center;
  }
  .hero-bg-dark {
    background-image: url('images/members/sign-in-dark-hd.png');
    background-size: cover;
    background-position: center;
  }
</style>
</head>
<body class="bg-white dark:bg-dark-bg min-h-screen flex items-center justify-center px-6 sm:px-10 lg:px-16 py-6 sm:py-8 transition-colors">

<!-- Logo: pinned near the top of the viewport, independent of the centered hero -->
<a href="index.html" aria-label="AutoSTAD home" class="fixed top-4 sm:top-6 left-4 sm:left-6 z-30 inline-flex items-center">
  <img src="./images/members/lightmode.png" alt="AutoSTAD" class="h-9 sm:h-10 w-auto dark:hidden" />
  <img src="./images/members/darkmode.png" alt="AutoSTAD" class="h-9 sm:h-10 w-auto hidden dark:block" />
</a>

<!-- Back + theme toggle: pinned near the top of the viewport -->
<div class="fixed top-4 sm:top-6 right-4 sm:right-6 z-30 flex items-center gap-2">
  <button id="theme-toggle" aria-label="Toggle dark mode"
    class="w-9 h-9 flex items-center justify-center rounded-xl border border-border dark:border-gray-700 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
    <svg id="theme-icon-moon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    <svg id="theme-icon-sun" class="w-3.5 h-3.5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
  </button>
  <a href="index.html" aria-label="Go back"
     class="w-[46px] h-9 flex items-center justify-center rounded-xl bg-button hover:bg-button-hover text-white transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
  </a>
</div>

<div class="relative w-full max-w-[1450px] mx-auto">

  <!-- Hero: photo panel + card, side by side in their own sections -->
  <div class="flex flex-col lg:flex-row lg:items-center gap-5 lg:gap-8">

    <!-- Photo panel: square corners, swaps image between light/dark mode -->
    <!-- <div class="relative w-full lg:w-[860px] lg:shrink-0 max-w-full aspect-video overflow-hidden shadow-xl">
      <div class="absolute inset-0 hero-bg-light dark:hidden"></div>
      <div class="absolute inset-0 hero-bg-dark hidden dark:block"></div>

      <div class="relative z-10 h-full flex flex-col justify-start px-6 sm:px-8 pt-8 sm:pt-10 pb-6 sm:pb-8">
        <p class="text-xs font-medium tracking-[0.25em] text-gray-600 dark:text-gray-300 mb-2">WELCOME BACK</p>
        <h1 class="text-3xl sm:text-4xl font-medium text-gray-900 dark:text-white leading-tight">Welcome Back.</h1>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-300 max-w-sm">Experience the world's most exclusive supercars.</p>
      </div>
    </div> -->
      <div class="relative w-full lg:w-[860px] lg:shrink-0 max-w-full aspect-video overflow-hidden shadow-xl">
      <img src="./images/sign-in-light-hd.png" alt="" class="absolute inset-0 w-full h-full object-cover dark:hidden" />
      <img src="./images/sign-in-dark-hd.png" alt="" class="absolute inset-0 w-full h-full object-cover hidden dark:block" />
     

      <div class="relative z-10 h-full flex flex-col justify-start px-6 sm:px-8 pt-8 sm:pt-10 pb-6 sm:pb-8">
        <p class="text-xs font-medium tracking-[0.25em] text-gray-600 dark:text-gray-300 mb-2">WELCOME BACK</p>
        <h1 class="text-3xl sm:text-4xl font-medium text-gray-900 dark:text-white leading-tight">Welcome Back.</h1>
        <p c>Experience the world's most exclusive supercars.</p>
      </div>
    </div>
    <!-- Card: its own section beside the photo, no overlap -->
    <div class="relative z-10 w-full lg:w-[390px] lg:shrink-0">

      <!-- Red ambient hue -->
      <div class="absolute -right-10 top-1/2 -translate-y-1/2 w-48 h-48 rounded-full bg-primary/25 blur-3xl pointer-events-none -z-10"></div>

      <div class="bg-primary-bg dark:bg-black/40 backdrop-blur-2xl backdrop-saturate-150 border border-white/50 dark:border-white/10 rounded-[28px] shadow-[0_30px_80px_rgba(0,0,0,0.12)] px-9 py-7">
        <h2 class="text-xl font-medium text-primary">Sign In</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Welcome back to AutoSTAD</p>

        <form id="login-form" class="mt-5 space-y-3" novalidate>
          <div>
            <label for="email" class="block text-xs font-medium text-gray-900 dark:text-gray-200 mb-1.5">Email</label>
            <div class="relative">
              <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-900 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.9 5.3a2 2 0 002.2 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              <input id="email" type="email" required placeholder="Enter your email"
                class="w-full h-11 pl-10 pr-4 text-xs rounded-xl border border-white/60 dark:border-white/10 bg-white/60 dark:bg-white/10 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary" />
            </div>
          </div>

          <div>
            <label for="password" class="block text-xs font-medium text-gray-900 dark:text-gray-200 mb-1.5">Password</label>
            <div class="relative">
              <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-900 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              <input id="password" type="password" required placeholder="Enter your password"
                class="w-full h-11 pl-10 pr-10 text-xs rounded-xl border border-white/60 dark:border-white/10 bg-white/60 dark:bg-white/10 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary" />
              <button type="button" data-toggle-password="password" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-900 dark:text-gray-300 hover:text-gray-700 dark:hover:text-white" aria-label="Show password">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between gap-2 text-[11px] sm:text-xs">
            <label class="flex items-center gap-1.5 whitespace-nowrap text-gray-500 dark:text-gray-400 font-normal">
              <input type="checkbox" class="shrink-0 rounded border-border dark:border-gray-600 text-primary focus:ring-primary" />
              Remember Me
            </label>
            <a href="#" class="whitespace-nowrap font-medium text-primary hover:text-button-hover">Forgot Password?</a>
          </div>

          <button type="submit" class="w-full h-11 rounded-xl bg-button hover:bg-button-hover text-white font-medium text-xs transition-colors">
            Sign In
          </button>

          <div class="flex items-center gap-3 py-1">
            <div class="h-px flex-1 bg-border dark:bg-gray-700"></div>
            <span class="text-xs text-gray-400 dark:text-gray-500 font-normal">or continue with</span>
            <div class="h-px flex-1 bg-border dark:bg-gray-700"></div>
          </div>

          <button type="button" class="w-full h-11 flex items-center justify-center gap-2 rounded-xl border border-border dark:border-gray-700 text-xs font-normal text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.3v3.1C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.3C.5 8.2 0 10 0 12s.5 3.8 1.3 5.4l4.1-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l4.1 3.1c.9-2.8 3.5-4.9 6.6-4.9z"/></svg>
            Continue with Google
          </button>
          <button type="button" class="w-full h-11 flex items-center justify-center gap-2 rounded-xl border border-border dark:border-gray-700 text-xs font-normal text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16.4 1c.1 1.1-.3 2.2-1 3-.7.9-1.9 1.6-3 1.5-.1-1.1.4-2.2 1-3C14.2 1.6 15.4 1 16.4 1zm4.3 16.2c-.4 1-.9 1.9-1.6 2.8-.9 1.2-1.9 2.5-3.3 2.5-1.3 0-1.7-.8-3.2-.8-1.5 0-2 .8-3.2.8-1.3 0-2.3-1.3-3.3-2.5-1.9-2.5-3.3-7-1.4-10.1.9-1.5 2.5-2.5 4.3-2.5 1.3 0 2.5.9 3.2.9.7 0 2.1-1.1 3.6-.9.6 0 2.4.3 3.5 1.9-.1.1-2.1 1.2-2.1 3.6.1 2.9 2.5 3.9 2.5 3.9z"/></svg>
            Continue with Apple
          </button>

          <p class="text-center text-xs text-gray-600 dark:text-gray-400 pt-1 font-normal">
            Don't have an account? <a href="register.html" class="font-medium text-primary hover:text-button-hover">Create Account</a>
          </p>
        </form>
      </div>
    </div>

  </div>
</div>

<script src="theme.js" defer></script>
<script src="login.js" defer></script>
</body>
</html>
