<!DOCTYPE html>
<html lang="en">
<head>
<script>
  if (localStorage.getItem('autostad-theme') === 'dark') document.documentElement.classList.add('dark');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoSTAD | Navbar Component</title>
<meta name="description" content="AutoSTAD navigation bar component — copy the <nav> block into every page." />
<link rel="stylesheet" href="src/output.css" />
<style>
  .underline-active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -14px;
    height: 2px;
    background: var(--color-primary);
    border-radius: 2px;
  }
</style>
</head>
<body class="bg-gray-100 dark:bg-dark-bg min-h-screen transition-colors">

<!-- ============ NAVBAR (copy everything inside this comment block into your pages) ============ -->
<header class="sticky top-0 z-50">
  <nav class="w-full bg-gray-100 dark:bg-gray-900 px-6 py-3 flex items-center justify-between shadow-sm border-b border-gray-200/60 dark:border-gray-800">
    <!-- Logo -->
 <a href="/" class="flex flex-col items-start shrink-0" aria-label="AutoSTAD home">
  <img src="images/members/lightmode.png" alt="AutoSTAD" class="h-10 w-auto dark:hidden" />
  <img src="images/members/darkmode.png" alt="AutoSTAD" class="h-10 w-auto hidden dark:block" />
  <p class="hidden sm:block text-[9px] tracking-[0.2em] text-gray-500 dark:text-gray-400 font-medium">DRIVE YOUR LEGEND</p>
</a>

    <!-- Desktop links -->
    <ul class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-600 dark:text-gray-300">
      <li><a href="/" class="hover:text-primary transition-colors">Home</a></li>
      <li class="relative">
        <a href="/cars" class="underline-active relative text-primary font-semibold">Cars</a>
      </li>
      <li><a href="/about" class="hover:text-primary transition-colors">About</a></li>
      <li><a href="/contact" class="hover:text-primary transition-colors">Contact</a></li>
      <li>
        <!-- Dropdown example: Login & Register -->
        <div class="relative group">
          <button class="flex items-center gap-1 hover:text-primary transition-colors" aria-haspopup="true" aria-expanded="false">
            Login &amp; Register
            <svg class="w-3.5 h-3.5 mt-0.5 transition-transform group-hover:rotate-180" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
          </button>
          <div class="invisible opacity-0 group-hover:visible group-hover:opacity-100 transition-all absolute top-full left-1/2 -translate-x-1/2 mt-3 w-40 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-100 dark:border-gray-700 py-2 z-50">
            <a href="login.html" class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700 rounded-lg mx-1">Sign In</a>
            <a href="register.html" class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700 rounded-lg mx-1">Register</a>
          </div>
        </div>
      </li>
    </ul>

    <!-- Right icons -->
    <div class="flex items-center gap-3">
      <button class="hidden sm:flex w-9 h-9 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition-colors" aria-label="Search">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
      </button>

      <!-- Dark mode toggle -->
      <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition-colors" aria-label="Toggle dark mode">
        <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>

      <button class="hidden sm:flex w-9 h-9 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition-colors" aria-label="Account">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </button>

      <a href="login.html" class="flex items-center gap-1.5 bg-button hover:bg-button-hover text-white text-sm font-semibold px-5 py-2.5 rounded-full transition-colors">
        Sign In
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>

      <!-- Mobile menu button -->
      <button id="mobile-menu-btn" class="md:hidden w-9 h-9 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-200" aria-label="Open menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </nav>

  <!-- Mobile dropdown menu -->
  <div id="mobile-menu" class="hidden md:hidden max-w-7xl mx-auto mt-2 bg-gray-100 dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-200/60 dark:border-gray-800 p-4">
    <ul class="flex flex-col gap-1 text-sm font-medium text-gray-700 dark:text-gray-200">
      <li><a href="/" class="block px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800">Home</a></li>
      <li><a href="/cars" class="block px-3 py-2.5 rounded-lg text-primary font-semibold bg-icon-bg dark:bg-gray-800">Cars</a></li>
      <li><a href="/about" class="block px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800">About</a></li>
      <li><a href="/contact" class="block px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800">Contact</a></li>
      <li><a href="login.html" class="block px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800">Login &amp; Register</a></li>
    </ul>
  </div>
</header>
<!-- ============ END NAVBAR ============ -->

<main class="max-w-3xl mx-auto px-6 py-16 text-center text-gray-500 dark:text-gray-400">
</main>

<script src="theme.js" defer></script>
<script src="navbar.js" defer></script>
</body>
</html>
