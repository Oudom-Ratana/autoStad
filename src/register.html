<!DOCTYPE html>
<html lang="en">
<head>
<script>
  if (localStorage.getItem('autostad-theme') === 'dark') document.documentElement.classList.add('dark');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account | AutoSTAD</title>
<meta name="description" content="Join AutoSTAD and enter the world of the most exclusive supercars." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: { primary: { 500:'#ef4444', 600:'#dc2626', 700:'#b91c1c' } },
        fontFamily: { sans: ['Poppins', 'sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; }
  .hero-bg {
    background-image: linear-gradient(90deg, rgba(0,0,0,.65), rgba(0,0,0,.35) 55%, rgba(0,0,0,.15)),
      url('../images/register-hero.png');
    background-size: cover;
    background-position: center;
  }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors">

<div class="relative w-full max-w-6xl min-h-[600px] rounded-3xl overflow-hidden shadow-2xl hero-bg flex flex-col md:flex-row md:items-center py-8 md:py-0">

  <!-- Back + dark mode toggle -->
  <div class="absolute top-6 right-6 z-20 flex items-center gap-2">
    <button id="theme-toggle" aria-label="Toggle dark mode"
       class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white/90 dark:bg-gray-900/80 hover:bg-white text-gray-700 dark:text-gray-200 transition-colors backdrop-blur">
      <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    </button>
    <a href="index.html" aria-label="Go back"
       class="w-11 h-11 flex items-center justify-center rounded-2xl bg-primary-600/90 hover:bg-primary-600 text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
  </div>

  <!-- Logo top-left -->
  <a href="index.html" class="absolute top-6 left-8 z-20 flex items-center bg-white/90 dark:bg-gray-900/80 backdrop-blur rounded-xl px-3 py-2 shadow-sm">
    <img src="images/logo-black.png" alt="AutoSTAD" class="h-6 w-auto dark:hidden" />
    <img src="images/logo-gold.png" alt="AutoSTAD" class="h-6 w-auto hidden dark:block" />
  </a>

  <!-- Left: headline + hero image + trust badges -->
  <div class="relative w-full md:w-[55%] self-stretch min-h-[420px] md:min-h-0 flex flex-col justify-center gap-8 px-8 sm:px-14 pt-24 pb-10">
    <div>
      <h1 class="text-4xl sm:text-5xl font-extrabold text-white leading-tight">Join AutoSTAD</h1>
      <p class="mt-4 text-gray-200 max-w-sm">Create your account and enter the world of the most exclusive supercars.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs text-gray-200 mt-10">
      <div class="flex items-start gap-2">
        <svg class="w-5 h-5 text-primary-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/></svg>
        <div><p class="font-semibold text-white">Trusted Platform</p><p class="text-gray-300">Secure &amp; verified</p></div>
      </div>
      <div class="flex items-start gap-2">
        <svg class="w-5 h-5 text-primary-500 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.8 1.7 6.9L12 17.3 5.7 20.9l1.7-6.9L2 9.2l7.1-.6z"/></svg>
        <div><p class="font-semibold text-white">Exclusive Inventory</p><p class="text-gray-300">Handpicked supercars</p></div>
      </div>
      <div class="flex items-start gap-2">
        <svg class="w-5 h-5 text-primary-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 18v-6a9 9 0 0118 0v6M3 18a2 2 0 002 2h1a2 2 0 002-2v-2a2 2 0 00-2-2H3v4zm18 0a2 2 0 01-2 2h-1a2 2 0 01-2-2v-2a2 2 0 012-2h3v4z"/></svg>
        <div><p class="font-semibold text-white">Concierge Support</p><p class="text-gray-300">Here for you 24/7</p></div>
      </div>
    </div>
  </div>

  <!-- Right: create account card -->
  <div class="relative z-10 flex w-full md:w-[420px] md:mr-14 mx-4 md:mx-0 my-8 md:my-0">
    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-8 w-full md:max-h-[600px] md:overflow-y-auto">
      <div class="flex flex-col items-center text-center mb-5">
        <div class="w-14 h-14 rounded-full bg-primary-100 dark:bg-primary-500/20 flex items-center justify-center mb-3">
          <svg class="w-6 h-6 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900 dark:text-white">Create Account</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Fill in your details to get started</p>
      </div>

      <form class="space-y-3.5" novalidate onsubmit="event.preventDefault(); alert('Demo only — connect this to your backend.');">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <label for="fullname" class="sr-only">Full Name</label>
          <input id="fullname" type="text" required placeholder="Full Name"
            class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500" />
        </div>

        <div class="relative">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.9 5.3a2 2 0 002.2 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <label for="reg-email" class="sr-only">Email Address</label>
          <input id="reg-email" type="email" required placeholder="Email Address"
            class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500" />
        </div>

        <div class="relative">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h2.3a1 1 0 01.97.76l1 4a1 1 0 01-.27.95L7.4 10.3a12 12 0 006.3 6.3l1.6-1.6a1 1 0 01.95-.27l4 1a1 1 0 01.76.97V19a2 2 0 01-2 2h-1C9.8 21 3 14.2 3 6V5z"/></svg>
          <label for="phone" class="sr-only">Phone Number</label>
          <input id="phone" type="tel" required placeholder="Phone Number"
            class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500" />
        </div>

        <div class="relative">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <label for="reg-password" class="sr-only">Password</label>
          <input id="reg-password" type="password" required placeholder="Password"
            class="w-full pl-10 pr-10 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500" />
          <button type="button" onclick="togglePassword('reg-password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" aria-label="Show password">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
          </button>
        </div>

        <div class="relative">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <label for="confirm-password" class="sr-only">Confirm Password</label>
          <input id="confirm-password" type="password" required placeholder="Confirm Password"
            class="w-full pl-10 pr-10 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500" />
          <button type="button" onclick="togglePassword('confirm-password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" aria-label="Show password">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
          </button>
        </div>

        <div class="relative">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 000 18M12.5 3a17 17 0 010 18M12 21a9 9 0 100-18 9 9 0 000 18z"/></svg>
          <label for="country" class="sr-only">Country</label>
          <select id="country" required
            class="w-full pl-10 pr-8 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500 appearance-none">
            <option value="" disabled selected>Country</option>
            <option>Cambodia</option>
            <option>Thailand</option>
            <option>Vietnam</option>
            <option>Singapore</option>
            <option>Other</option>
          </select>
          <svg class="w-3.5 h-3.5 absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm transition-colors">
          Create Account
        </button>

        <p class="text-center text-sm text-gray-500 dark:text-gray-400 pt-1">
          Already have an account? <a href="login.html" class="font-semibold text-primary-600 hover:text-primary-700">Login</a>
        </p>
      </form>
    </div>
  </div>

</div>

<script>
  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  // Dark mode toggle
  const themeToggle = document.getElementById('theme-toggle');
  const moonIcon = document.getElementById('theme-icon-moon');
  const sunIcon = document.getElementById('theme-icon-sun');

  function applyTheme(isDark) {
    document.documentElement.classList.toggle('dark', isDark);
    moonIcon.classList.toggle('hidden', isDark);
    sunIcon.classList.toggle('hidden', !isDark);
  }
  applyTheme(document.documentElement.classList.contains('dark'));

  themeToggle.addEventListener('click', () => {
    const isDark = !document.documentElement.classList.contains('dark');
    applyTheme(isDark);
    localStorage.setItem('autostad-theme', isDark ? 'dark' : 'light');
  });
</script>
</body>
</html>
