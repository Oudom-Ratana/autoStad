<!DOCTYPE html>
<html lang="en">
<head>
<script>
  if (localStorage.getItem('autostad-theme') === 'dark') document.documentElement.classList.add('dark');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In | AutoSTAD</title>
<meta name="description" content="Sign in to your AutoSTAD account to browse and manage your exclusive supercar collection." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: { primary: { 500:'#ef4444', 600:'#dc2626', 700:'#b91c1c' } },
        fontFamily: { sans: ['Poppins', 'sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; }
  .hero-bg {
    background-image: linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,.1)),
      url('https://images.unsplash.com/photo-1621135802920-133df287f89c?q=80&w=1600&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
  }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors">

<div class="relative w-full max-w-6xl min-h-[600px] rounded-3xl overflow-hidden shadow-2xl hero-bg flex items-center">

  <!-- Back + dark mode toggle -->
  <div class="absolute top-6 right-6 z-20 flex items-center gap-2">
    <button id="theme-toggle" aria-label="Toggle dark mode"
       class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white/90 dark:bg-gray-900/80 hover:bg-white text-gray-700 dark:text-gray-200 transition-colors backdrop-blur">
      <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    </button>
    <a href="index.html" aria-label="Go back"
       class="w-11 h-11 flex items-center justify-center rounded-2xl bg-primary-600/90 hover:bg-primary-600 text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
  </div>

  <!-- Logo top-left -->
  <a href="index.html" class="absolute top-6 left-8 z-20 flex items-center bg-white/90 dark:bg-gray-900/80 backdrop-blur rounded-xl px-3 py-2 shadow-sm">
    <img src="images/logo-black.png" alt="AutoSTAD" class="h-6 w-auto dark:hidden" />
    <img src="images/logo-gold.png" alt="AutoSTAD" class="h-6 w-auto hidden dark:block" />
  </a>

  <!-- Left: headline over hero image -->
  <div class="relative z-10 w-full md:w-1/2 px-8 sm:px-14 pt-24 md:pt-0">
    <p class="text-xs font-semibold tracking-[0.25em] text-gray-200 mb-3">WELCOME BACK</p>
    <h1 class="text-4xl sm:text-5xl font-extrabold text-white leading-tight">Welcome Back.</h1>
    <p class="mt-4 text-gray-200 max-w-sm">Experience the world's most exclusive supercars.</p>
  </div>

  <!-- Right: sign in card -->
  <div class="relative z-10 w-full md:w-[420px] md:mr-16 md:ml-auto mt-8 md:mt-0 mx-4 md:mx-0">
    <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-xl p-8">
      <h2 class="text-2xl font-bold text-primary-600">Sign In</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Welcome back to AutoSTAD</p>

      <form class="mt-6 space-y-4" novalidate onsubmit="event.preventDefault(); alert('Demo only — connect this to your backend.');">
        <div>
          <label for="email" class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1.5">Email</label>
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.9 5.3a2 2 0 002.2 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <input id="email" type="email" required placeholder="Enter your email"
              class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500" />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1.5">Password</label>
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <input id="password" type="password" required placeholder="Enter your password"
              class="w-full pl-10 pr-10 py-2.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500" />
            <button type="button" onclick="togglePassword('password', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" aria-label="Show password">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-gray-500 dark:text-gray-400">
            <input type="checkbox" class="rounded border-gray-300 text-primary-600 focus:ring-primary-500" />
            Remember Me
          </label>
          <a href="#" class="font-semibold text-primary-600 hover:text-primary-700">Forgot Password?</a>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm transition-colors">
          Sign in
        </button>

        <div class="flex items-center gap-3 py-1">
          <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>
          <span class="text-xs text-gray-400">or continue with</span>
          <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>
        </div>

        <button type="button" class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.3v3.1C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.3C.5 8.2 0 10 0 12s.5 3.8 1.3 5.4l4.1-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l4.1 3.1c.9-2.8 3.5-4.9 6.6-4.9z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16.4 1c.1 1.1-.3 2.2-1 3-.7.9-1.9 1.6-3 1.5-.1-1.1.4-2.2 1-3C14.2 1.6 15.4 1 16.4 1zm4.3 16.2c-.4 1-.9 1.9-1.6 2.8-.9 1.2-1.9 2.5-3.3 2.5-1.3 0-1.7-.8-3.2-.8-1.5 0-2 .8-3.2.8-1.3 0-2.3-1.3-3.3-2.5-1.9-2.5-3.3-7-1.4-10.1.9-1.5 2.5-2.5 4.3-2.5 1.3 0 2.5.9 3.2.9.7 0 2.1-1.1 3.6-.9.6 0 2.4.3 3.5 1.9-.1.1-2.1 1.2-2.1 3.6.1 2.9 2.5 3.9 2.5 3.9z"/></svg>
          Continue with Apple
        </button>

        <p class="text-center text-sm text-gray-500 dark:text-gray-400 pt-1">
          Don't have an account? <a href="register.html" class="font-semibold text-primary-600 hover:text-primary-700">Create Account</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script>
  function togglePassword(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  // Dark mode toggle
  const themeToggle = document.getElementById('theme-toggle');
  const moonIcon = document.getElementById('theme-icon-moon');
  const sunIcon = document.getElementById('theme-icon-sun');

  function applyTheme(isDark) {
    document.documentElement.classList.toggle('dark', isDark);
    moonIcon.classList.toggle('hidden', isDark);
    sunIcon.classList.toggle('hidden', !isDark);
  }
  applyTheme(document.documentElement.classList.contains('dark'));

  themeToggle.addEventListener('click', () => {
    const isDark = !document.documentElement.classList.contains('dark');
    applyTheme(isDark);
    localStorage.setItem('autostad-theme', isDark ? 'dark' : 'light');
  });
</script>
</body>
</html>
